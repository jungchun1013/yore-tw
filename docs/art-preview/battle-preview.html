  var BattleMotion = class {
    constructor() {
      this.travel = 0;
      this.killAge = Infinity;
      this.spawnAge = 1;
      this.deathAge = 0;
      this.reviveAge = 1;
      this.wasDown = false;
      this.phase = "fight";
    }
    kill() {
      this.killAge = 0;
    }
    spawn() {
      this.spawnAge = 0;
    }
    death() {
      this.deathAge = 0;
      this.killAge = Infinity;
      this.wasDown = true;
    }
    update(dt, downFor) {
      dt = Math.max(0, Math.min(dt, 0.1));
      this.spawnAge += dt;
      this.reviveAge += dt;
      if (downFor > 0) {
        if (!this.wasDown)
          this.death();
        this.deathAge += dt;
        this.phase = this.deathAge < 0.7 ? "death" : "soul";
      } else if (this.wasDown) {
        this.wasDown = false;
        this.reviveAge = 0;
        this.deathAge = 0;
        this.phase = "rebirth";
      } else if (this.reviveAge < 0.8)
        this.phase = "rebirth";
      else {
        const previous = this.killAge;
        this.killAge += dt;
        const moving = Math.max(0, Math.min(0.6, this.killAge) - Math.max(0.12, Math.min(0.6, previous)));
        this.travel += moving * 75;
        this.phase = this.killAge < 0.6 ? "advance" : "fight";
      }
    }
  };

  var W = 320;

          this.float(238 + (e.from === "pet" ? -10 : 0), 46, num(e.dmg) + (e.crit ? "!" : ""), col);
        }
      } else if (e.t === "heal")
        this.float(70, 40, "+" + num(e.amt), "#7ee081");

        this.motion.kill();
      else if (e.t === "spawn")
        this.motion.spawn();
      else if (e.t === "death")
        this.motion.death();

        this.float(70, 30, "LEVEL UP", "#ffd166");

      if (down || motion.reviveAge < 0.8) {

        c.globalAlpha = darkness;
        c.fillStyle = "#202332";
        c.fillRect(0, 0, W, H);
        c.globalAlpha = 1;
        if (down) {
          const returning = g2.downFor < 1;

          c.fillStyle = "#d9ded0";
          c.fillRect(sx - 3, sy - 1, 6, 6);
          c.fillRect(sx - 2, sy - 3, 4, 2);
          c.fillRect(sx - 3, sy + 5, 2, 3);
          c.fillRect(sx + 1, sy + 5, 2, 2);
          c.fillStyle = "#536773";
          c.fillRect(sx - 2, sy + 1, 1, 2);
          c.fillRect(sx + 1, sy + 1, 1, 2);
          if (!reduced)
            for (let i = 0; i < 5; i++) {
              c.globalAlpha = 0.45 * (1 - i / 5);
              c.fillStyle = "#bcc5bd";
              c.fillRect(sx + Math.round(Math.sin(this.t * 3 + i) * 7), sy + 11 + i * 3, 1, 2);
            }
          c.globalAlpha = 1;
        } else {
          c.globalAlpha = Math.max(0, 1 - motion.reviveAge / 0.8);
          const width = Math.round(34 * (1 - motion.reviveAge / 0.8));
          c.fillStyle = "#bcc5bd";
          c.fillRect(hx - width / 2, 89, width, 1);
          c.globalAlpha = 1;

      c.textAlign = "center";
      c.font = "11px Cubic11, monospace";
      for (const f of this.floats) {
        f.age += dt;
        c.globalAlpha = Math.max(0, 1 - f.age / 1.1);
        c.fillStyle = "#000";
        c.fillText(f.text, f.x + 1, f.y - f.age * 22 + 1);
        c.fillStyle = f.color;
        c.fillText(f.text, f.x, f.y - f.age * 22);

      c.globalAlpha = 1;
      this.floats = this.floats.filter((f) => f.age < 1.1);
    }
