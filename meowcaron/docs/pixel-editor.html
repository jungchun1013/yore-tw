<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meowcaron Pixel Editor</title>
<style>
  :root { --bg:#FFF7F0; --card:#FFFFFF; --line:#F0DFD3; --ink:#5A4038; --muted:#9C8A82; --accent:#F28CA3; --accent-ink:#7A3A4A; --mint:#BFE8D4; --lemon:#FBECA6;
    font-family: "Nunito","Avenir Next","Segoe UI","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#2A2220; --card:#352B28; --line:#4A3C37; --ink:#F6E9E1; --muted:#B8A79E; } }
  :root[data-theme="dark"] { --bg:#2A2220; --card:#352B28; --line:#4A3C37; --ink:#F6E9E1; --muted:#B8A79E; }
  * { box-sizing:border-box; } html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); }
  body { display:grid; grid-template-columns: 260px 1fr 240px; grid-template-rows: 56px 1fr; height:100dvh; font-size:16px; }
  header { grid-column:1/-1; display:flex; align-items:center; gap:12px; padding:0 16px; border-bottom:2px solid var(--line); background:var(--card); }
  header b { font-size:20px; } header .status { margin-left:auto; color:var(--muted); font-weight:800; }
  .btn { border:2px solid var(--line); background:var(--card); color:var(--ink); border-radius:12px; padding:8px 14px; font-weight:900; font-size:16px; cursor:pointer; }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); } .btn.on { background:var(--mint); border-color:#8FCDB2; color:#2F6B4F; }
  aside { border-right:2px solid var(--line); overflow:auto; padding:10px; } aside.right { border-right:0; border-left:2px solid var(--line); }
  .group { font-weight:900; color:var(--muted); margin:10px 6px 4px; font-size:14px; text-transform:uppercase; letter-spacing:.5px; }
  .item { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:10px; cursor:pointer; font-weight:800; }
  .item:hover { background:var(--line); } .item.on { background:var(--lemon); color:#5A4038; }
  .item canvas { image-rendering:pixelated; width:36px; height:36px; background:#F5E6DA; border-radius:6px; }
  .item.edited::after { content:'●'; color:var(--accent); margin-left:auto; }
  main { display:flex; flex-direction:column; min-width:0; min-height:0; }
  .tools { display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px; border-bottom:2px solid var(--line); align-items:center; }
  .tools .sep { width:2px; height:28px; background:var(--line); }
  .stage { flex:1; min-height:0; display:grid; place-items:center; padding:14px; overflow:auto; }
  #grid { image-rendering:pixelated; touch-action:none; cursor:crosshair; background:
    repeating-conic-gradient(#EADFD4 0 25%, #F7EDE4 0 50%) 0 0 / 16px 16px; border:2px solid var(--line); border-radius:6px; }
  .previews { display:flex; gap:14px; align-items:flex-end; padding:8px 14px 14px; border-top:2px solid var(--line); }
  .previews canvas { image-rendering:pixelated; background:#F0D6C6; border-radius:6px; }
  .sw { display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:10px; cursor:pointer; font-weight:900; }
  .sw.on { background:var(--lemon); color:#5A4038; } .sw i { width:28px; height:28px; border-radius:8px; border:2px solid var(--line); display:inline-block; }
  .sw input[type=color] { width:36px; height:30px; border:0; background:none; padding:0; margin-left:auto; }
  .sw.eraser i { background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 8px 8px; }
  .muted { color:var(--muted); font-size:14px; padding:6px 8px; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 56px auto 1fr auto; } aside { max-height:160px; border:0; border-bottom:2px solid var(--line); display:flex; gap:6px; overflow:auto; } aside.right { display:block; max-height:none; border-top:2px solid var(--line); } .group { display:none; } .item span { display:none; } }
</style>
</head>
<body>
<header>
  <b>🐾 Meowcaron 像素編輯器</b>
  <button class="btn" id="undo">↶ 復原</button>
  <button class="btn" id="reset">重設此圖</button>
  <button class="btn" id="export">複製 JSON</button>
  <button class="btn primary" id="save">儲存到雲端</button>
  <span class="status" id="status">載入中…</span>
</header>
<aside id="list"></aside>
<main>
  <div class="tools">
    <button class="btn on" data-tool="pen">✏️ 畫筆</button>
    <button class="btn" data-tool="eraser">⌫ 橡皮</button>
    <button class="btn" data-tool="fill">🪣 填滿</button>
    <button class="btn" data-tool="pick">💉 吸色</button>
    <span class="sep"></span>
    <button class="btn" id="mirror">↔ 左右對稱</button>
    <span class="sep"></span>
    <button class="btn" id="colL">◀ 加左欄</button><button class="btn" id="colR">加右欄 ▶</button>
    <button class="btn" id="rowT">▲ 加上列</button><button class="btn" id="rowB">加下列 ▼</button>
    <button class="btn" id="trim">✂ 裁掉空邊</button>
    <span class="muted" id="dims"></span>
  </div>
  <div class="stage"><canvas id="grid"></canvas></div>
  <div class="previews"><span class="muted">預覽</span><canvas id="p1"></canvas><canvas id="p3"></canvas><canvas id="p6"></canvas></div>
</main>
<aside class="right">
  <div class="group">調色盤</div>
  <div id="palette"></div>
  <button class="btn" id="addColor" style="margin:8px">＋ 新增顏色</button>
  <div class="muted">字母只是顏色代號；外框固定是 #（深棕）。畫完按「儲存到雲端」，我這邊就讀得到。</div>
</aside>

const OUTLINE = '#5A4038';
const state = { key: null, rows: [], colors: {}, tool: 'pen', letter: '#', mirror: false, undo: [], edited: {}, cloud: {} };
let db = null, canWrite = false;
const $ = (s) => document.querySelector(s);
const status = (t) => { $('#status').textContent = t; };
const groups = {};
for (const k of Object.keys(SPRITES)) { const g = k.split(':')[0]; (groups[g] = groups[g] || []).push(k); }
const GROUP_NAME = { furniture: '家具', pack: '禮物', prop: '廚具', emote: '表情符號', cat: '貓咪', hero: '店長', misc: '其他', pat: '拍拍圖示' };
function draw(rows, colors, cv, scale) {
  const w = rows[0].length, h = rows.length; cv.width = w * scale; cv.height = h * scale; const x = cv.getContext('2d'); x.clearRect(0, 0, cv.width, cv.height);
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) { const ch = rows[y][i]; if (ch === '.') continue; x.fillStyle = ch === '#' ? OUTLINE : (colors[ch] || '#ff00ff'); x.fillRect(i * scale, y * scale, scale, scale); }
}
function buildList() {
  const list = $('#list'); list.innerHTML = '';
  for (const g of Object.keys(groups)) {
    const head = document.createElement('div'); head.className = 'group'; head.textContent = GROUP_NAME[g] || g; list.append(head);
    for (const k of groups[g]) {
      const d = state.cloud[k] || SPRITES[k];
      const el = document.createElement('div'); el.className = 'item' + (k === state.key ? ' on' : '') + (state.cloud[k] ? ' edited' : ''); el.dataset.key = k;
      const c = document.createElement('canvas'); draw(d.rows, d.colors, c, 2); el.append(c, Object.assign(document.createElement('span'), { textContent: k.split(':').slice(1).join(' ') }));
      el.onclick = () => load(k); list.append(el);
    }
  }
}
function load(k) {
  state.key = k; const d = state.cloud[k] || SPRITES[k];
  state.rows = d.rows.slice(); state.colors = { ...d.colors }; state.undo = []; state.letter = Object.keys(state.colors)[0] || '#';
  render(); buildList(); buildPalette();
}
function cell() { const stage = $('.stage'); const w = state.rows[0].length, h = state.rows.length; return Math.max(6, Math.floor(Math.min((stage.clientWidth - 40) / w, (stage.clientHeight - 40) / h))); }
function render() {
  const cv = $('#grid'); const s = cell(); draw(state.rows, state.colors, cv, s);
  const x = cv.getContext('2d'); x.strokeStyle = 'rgba(90,64,56,0.18)'; x.lineWidth = 1;
  for (let i = 0; i <= state.rows[0].length; i++) { x.beginPath(); x.moveTo(i * s + .5, 0); x.lineTo(i * s + .5, cv.height); x.stroke(); }
  for (let j = 0; j <= state.rows.length; j++) { x.beginPath(); x.moveTo(0, j * s + .5); x.lineTo(cv.width, j * s + .5); x.stroke(); }
  draw(state.rows, state.colors, $('#p1'), 1); draw(state.rows, state.colors, $('#p3'), 3); draw(state.rows, state.colors, $('#p6'), 6);
  $('#dims').textContent = `${state.rows[0].length} × ${state.rows.length} px · ${state.key}`;
}
function buildPalette() {
  const pal = $('#palette'); pal.innerHTML = '';
  const mk = (letter, hex, label) => { const el = document.createElement('div'); el.className = 'sw' + (state.letter === letter ? ' on' : '') + (letter === '.' ? ' eraser' : ''); const i = document.createElement('i'); if (hex) i.style.background = hex; el.append(i, Object.assign(document.createElement('span'), { textContent: label }));
    if (hex && letter !== '#') { const inp = document.createElement('input'); inp.type = 'color'; inp.value = hex; inp.oninput = () => { state.colors[letter] = inp.value.toUpperCase(); i.style.background = inp.value; render(); }; inp.onclick = (e) => e.stopPropagation(); el.append(inp); }
    el.onclick = () => { state.letter = letter; buildPalette(); }; pal.append(el); };
  mk('#', OUTLINE, '# 外框'); for (const [L, hex] of Object.entries(state.colors)) if (L !== '#') mk(L, hex, L);
}
function setPx(i, y, ch) { if (y < 0 || y >= state.rows.length || i < 0 || i >= state.rows[0].length) return; const r = state.rows[y].split(''); r[i] = ch; state.rows[y] = r.join(''); if (state.mirror) { const m = state.rows[0].length - 1 - i; if (m !== i) { const rr = state.rows[y].split(''); rr[m] = ch; state.rows[y] = rr.join(''); } } }
function fill(i, y, ch) { const target = state.rows[y][i]; if (target === ch) return; const W = state.rows[0].length, H = state.rows.length; const st = [[i, y]]; const seen = new Set();
  while (st.length) { const [a, b] = st.pop(); const id = a + ',' + b; if (a < 0 || b < 0 || a >= W || b >= H || seen.has(id) || state.rows[b][a] !== target) continue; seen.add(id); const r = state.rows[b].split(''); r[a] = ch; state.rows[b] = r.join(''); st.push([a + 1, b], [a - 1, b], [a, b + 1], [a, b - 1]); } }
function pushUndo() { state.undo.push(state.rows.slice()); if (state.undo.length > 60) state.undo.shift(); }
let painting = false;
const grid = $('#grid');
function pos(e) { const r = grid.getBoundingClientRect(); const s = cell(); return [Math.floor((e.clientX - r.left) / s), Math.floor((e.clientY - r.top) / s)]; }
grid.addEventListener('pointerdown', (e) => { e.preventDefault(); grid.setPointerCapture(e.pointerId); const [i, y] = pos(e);
  if (state.tool === 'pick') { const ch = state.rows[y]?.[i]; if (ch && ch !== '.') { state.letter = ch; buildPalette(); } return; }
  pushUndo(); painting = true; if (state.tool === 'fill') { fill(i, y, state.letter); render(); painting = false; return; } setPx(i, y, state.tool === 'eraser' ? '.' : state.letter); render(); });

grid.addEventListener('pointerup', () => { painting = false; }); grid.addEventListener('pointercancel', () => { painting = false; });
document.querySelectorAll('[data-tool]').forEach((b) => b.onclick = () => { state.tool = b.dataset.tool; document.querySelectorAll('[data-tool]').forEach((x) => x.classList.toggle('on', x === b)); });
$('#mirror').onclick = (e) => { state.mirror = !state.mirror; e.target.classList.toggle('on', state.mirror); };
$('#undo').onclick = () => { const r = state.undo.pop(); if (r) { state.rows = r; render(); } };
$('#reset').onclick = () => { pushUndo(); const d = SPRITES[state.key]; state.rows = d.rows.slice(); state.colors = { ...d.colors }; render(); buildPalette(); };
$('#colL').onclick = () => { pushUndo(); state.rows = state.rows.map((r) => '.' + r); render(); };
$('#colR').onclick = () => { pushUndo(); state.rows = state.rows.map((r) => r + '.'); render(); };
$('#rowT').onclick = () => { pushUndo(); state.rows.unshift('.'.repeat(state.rows[0].length)); render(); };
$('#rowB').onclick = () => { pushUndo(); state.rows.push('.'.repeat(state.rows[0].length)); render(); };
$('#trim').onclick = () => { pushUndo(); let rows = state.rows.filter(() => true); while (rows.length > 1 && !/[^.]/.test(rows[0])) rows.shift(); while (rows.length > 1 && !/[^.]/.test(rows[rows.length - 1])) rows.pop();
  let l = 0, r = rows[0].length; while (l < r - 1 && rows.every((x) => x[l] === '.')) l++; while (r > l + 1 && rows.every((x) => x[r - 1] === '.')) r--; state.rows = rows.map((x) => x.slice(l, r)); render(); };
$('#addColor').onclick = () => { const letters = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; const L = [...letters].find((c) => !(c in state.colors)); if (!L) return; state.colors[L] = '#F28CA3'; state.letter = L; buildPalette(); };
$('#export').onclick = async () => { const txt = JSON.stringify({ key: state.key, rows: state.rows, colors: state.colors }); try { await navigator.clipboard.writeText(txt); status('JSON 已複製'); } catch { prompt('複製這段', txt); } };
$('#save').onclick = async () => {
  if (!db) { status('沒有雲端連線，請用「複製 JSON」'); return; }
  try { const doc = { key: state.key, rows: state.rows, colors: state.colors, updatedAt: Date.now() }; await db.doc('sprites/' + state.key.replace(/[:\/]/g, '_')).set(doc); state.cloud[state.key] = doc; buildList(); status('已儲存 ✓ ' + state.key); }
  catch (e) { status('儲存失敗：' + (e && e.code ? e.code : e)); }
};
window.addEventListener('resize', () => { if (state.key) render(); });
(async () => {
  buildList(); load(Object.keys(SPRITES)[0]);
  const timer = setTimeout(() => status('離線模式（可用複製 JSON）'), 10000);
  try {
    db = await claude.use('db');
    if (db) {
      const snap = await db.collection('sprites').get();
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.key && v.rows) state.cloud[v.key] = v; });
      canWrite = true; clearTimeout(timer); status(`已連線 · 雲端有 ${Object.keys(state.cloud).length} 張修改`); buildList(); if (state.cloud[state.key]) load(state.key);
    } else { clearTimeout(timer); status('離線模式（可用複製 JSON）'); }
  } catch (e) { clearTimeout(timer); status('雲端讀取失敗，仍可編輯與複製 JSON'); }
})();
